<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>理赔报案 Demo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #1f2430;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }
    main {
      width: 520px;
      max-width: 100%;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    .sub { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #374151; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d5dae4;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2f7ef7;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fdecec;
      border: 1px solid #f5c2c2;
      color: #b42318;
      font-size: 13px;
      white-space: pre-line;
    }
    #result { display: none; text-align: center; padding: 10px 0; }
    .badge {
      display: inline-block;
      margin: 12px 0;
      padding: 6px 16px;
      border-radius: 999px;
      background: #e7f7ee;
      border: 1px solid #b6e2c8;
      color: #027a48;
      font-weight: 700;
      font-size: 15px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    td { padding: 8px 10px; border-bottom: 1px solid #eef0f4; text-align: left; }
    td:first-child { color: #6b7280; width: 40%; }
    footer { margin-top: 18px; color: #9aa1ad; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>理赔报案</h1>
    <p class="sub">请填写出险信息，提交后系统自动受理。</p>

    <form id="claim-form">
      <label for="reporter-name">报案人姓名</label>
      <input id="reporter-name" placeholder="例如：张三" />

      <label for="policy-no">保单号（格式 PC-年份-6位数字）</label>
      <input id="policy-no" placeholder="例如：PC-2026-013872" />

      <label for="loss-date">出险日期（yyyy-mm-dd）</label>
      <input id="loss-date" placeholder="例如：2026-10-01" />

      <label for="loss-reason">出险原因</label>
      <select id="loss-reason">
        <option value="">请选择…</option>
        <option value="collision">车辆碰撞</option>
        <option value="property">家庭财产损失</option>
        <option value="travel">旅行延误</option>
        <option value="other">其他</option>
      </select>

      <label for="claim-amount">预估损失金额（元）</label>
      <input id="claim-amount" placeholder="例如：3500" />

      <button type="button" id="submit-btn">提交报案</button>
      <div class="error" id="form-error"></div>
    </form>

    <div id="result">
      <div class="badge" id="claim-status">已受理</div>
      <p class="sub" style="margin:0">受理号：<b id="claim-no"></b></p>
      <table id="result-summary"></table>
    </div>

    <footer>模拟页面 · 所有数据均为虚构，仅用于自动化演示</footer>
  </main>

  <script>
    var form = document.getElementById('claim-form');
    var errBox = document.getElementById('form-error');

    function val(id) { return document.getElementById(id).value.trim(); }

    document.getElementById('submit-btn').addEventListener('click', function () {
      var errors = [];
      var name = val('reporter-name');
      var policy = val('policy-no');
      var date = val('loss-date');
      var reason = document.getElementById('loss-reason');
      var amount = val('claim-amount');

      if (!name) errors.push('· 报案人姓名不能为空');
      if (!/^PC-\d{4}-\d{6}$/.test(policy)) errors.push('· 保单号格式不正确，应为 PC-年份-6位数字，例如 PC-2026-013872');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) errors.push('· 出险日期格式不正确，应为 yyyy-mm-dd');
      if (!reason.value) errors.push('· 请选择出险原因');
      if (!(Number(amount) > 0)) errors.push('· 预估损失金额必须大于 0');

      if (errors.length > 0) {
        errBox.textContent = errors.join('\n');
        errBox.style.display = 'block';
        return;
      }

      errBox.style.display = 'none';
      var claimNo = 'CLM-' + String(Math.floor(100000 + Math.random() * 900000));
      var reasonText = reason.options[reason.selectedIndex].text;

      form.style.display = 'none';
      document.getElementById('result').style.display = 'block';
      document.getElementById('claim-no').textContent = claimNo;
      document.getElementById('result-summary').innerHTML =
        '<tr><td>报案人</td><td>' + name + '</td></tr>' +
        '<tr><td>保单号</td><td>' + policy + '</td></tr>' +
        '<tr><td>出险日期</td><td>' + date + '</td></tr>' +
        '<tr><td>出险原因</td><td>' + reasonText + '</td></tr>' +
        '<tr><td>预估损失金额</td><td>¥' + amount + '</td></tr>';
    });
  </script>
</body>
</html>
