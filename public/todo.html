<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo Demo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6fa;
      color: #1f2430;
      display: flex;
      justify-content: center;
      padding: 60px 16px;
    }
    main {
      width: 480px;
      max-width: 100%;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }
    h1 { font-size: 22px; margin: 0 0 20px; }
    .row { display: flex; gap: 10px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d5dae4;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #4f8cff;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    li.todo-item {
      padding: 12px 14px;
      border: 1px solid #e4e8f0;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafbfd;
    }
    p { margin: 0; color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Todo Demo</h1>
    <div class="row">
      <input id="todo-input" placeholder="输入待办事项..." />
      <button id="add-btn">添加</button>
    </div>
    <ul id="todo-list"></ul>
    <p id="count">共 0 条</p>
  </main>
  <script>
    var list = document.getElementById('todo-list');
    var input = document.getElementById('todo-input');
    var addBtn = document.getElementById('add-btn');
    var count = document.getElementById('count');
    var n = 0;

    function add() {
      var text = input.value.trim();
      if (!text) return;
      var li = document.createElement('li');
      li.className = 'todo-item';
      li.textContent = text;
      list.appendChild(li);
      n += 1;
      count.textContent = '共 ' + n + ' 条';
      input.value = '';
    }

    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') add();
    });
  </script>
</body>
</html>
